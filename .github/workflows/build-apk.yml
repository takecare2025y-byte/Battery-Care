
name: Build Battery Care APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -o BatteryCareProject.zip -d extracted

      - name: Find Android Project
        run: |
          FILE=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$FILE" ]; then
            echo "ERROR: settings.gradle nahi mili"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

   
      - name: Fix Java and Kotlin Targets
        run: |
          cat > "$RUNNER_TEMP/fix-target.gradle" <<'EOF'
          gradle.projectsEvaluated {
              allprojects {
                  tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                      sourceCompatibility = "17"
                      targetCompatibility = "17"
                  }

                  tasks.configureEach { task ->
                      if (task.name.toLowerCase().contains("kotlin") &&
                          task.hasProperty("kotlinOptions")) {
                          task.kotlinOptions.jvmTarget = "17"
                      }
                  }
              }
          }
          EOF
   
        
      - name: Build APK
        run: gradle -I "$RUNNER_TEMP/fix-target.gradle" -p "$PROJECT_DIR" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BatteryCare-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
